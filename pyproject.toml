[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "videoautomater"
version = "0.1.0"
description = "Autonomous AI-Powered Video Creation & Multi-Platform Publishing System"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "Raheel Rehman", email = "raheelcr7@users.noreply.github.com"}
]
keywords = ["video", "automation", "ai", "content", "shorts", "reels", "ffmpeg"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "pydantic>=2.0.0",
    "edge-tts>=6.1.9",
    "pillow>=10.0.0",
    "matplotlib>=3.8.0",
    "numpy>=1.24.0",
    "imageio-ffmpeg>=0.4.9",
    "soundfile>=0.12.1",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "aiohttp>=3.9.0",
    "google-genai>=0.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]

[project.scripts]
videoautomater = "videoautomater.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP006", "UP035", "E501"]
